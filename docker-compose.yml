services:

  sugoi-postgres:
    image: sugoi-postgres:18.6
    container_name: sugoi-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sugoi
      POSTGRES_USER: hudson
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--locale=pt_BR.UTF-8 --encoding=UTF8"

    secrets:
      - postgres_password

    volumes:
      - sugoi-postgres-data:/var/lib/postgresql
      - /opt/docker/aplicacao/postgres/init:/docker-entrypoint-initdb.d:ro

    ports:
      - "5432:5432"

    networks:
      - sugoi-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hudson -d sugoi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hudson-app:
    image: hudson-app:base
    container_name: hudson-app
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      PYTHONPATH: /app

    depends_on:
      sugoi-postgres:
        condition: service_healthy

    volumes:
      - /home/hudson/HUDSON/storage:/app/storage
      - /mnt/corilda-hd:/dados:ro

    ports:
      - "8000:8000"

    networks:
      - sugoi-net

networks:
  sugoi-net:
    external: true

volumes:
  sugoi-postgres-data:
    external: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password
